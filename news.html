<script>
const PAGE_SIZE = 50;
const SEV = {
    CRITICAL: ["CRIT", "sev-crit", 4],
    HIGH:     ["HIGH", "sev-high", 3],
    MEDIUM:   ["MED",  "sev-med",  2],
    LOW:      ["LOW",  "sev-low",  1]
};
const CAT = {
    "ransomware":   "RANSOM",
    "vuln":         "VULN",
    "breach":       "BREACH",
    "apt":          "APT",
    "malware":      "MALWARE",
    "supply-chain": "SUPPLY-CHAIN",
    "ics":          "ICS/OT",
    "policy":       "POLICY",
    "business":     "BUSINESS"
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const catLabel = c => CAT[c] || String(c || "n/a").toUpperCase();
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : null;

let DB = null;
let byId = new Map();
const openIds = new Set();
const st = { min:0, days:3, cat:"all", q:"", sort:"date", dir:-1, page:1 };

/* data locale di oggi in formato YYYY-MM-DD, meno (days-1) giorni */
function cutoffDay(days){
    const d = new Date();
    const t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - (days - 1) * 86400000;
    return new Date(t).toISOString().slice(0, 10);
}

/* ── filtro + ordinamento ── */
function filtered(){
    const cutoff = cutoffDay(st.days);
    const q = st.q.trim().toLowerCase();
    const rows = DB.items.filter(i =>
        i.rank >= st.min &&
        (st.cat === "all" || i.category === st.cat) &&
        i.published.slice(0, 10) >= cutoff &&
        (!q || i.hay.includes(q))
    );
    rows.sort((a, b) => {
        let c;
        if(st.sort === "sev")        c = (a.rank - b.rank) || cmp(a.published, b.published);
        else if(st.sort === "title") c = cmp(a.title.toLowerCase(), b.title.toLowerCase());
        else                         c = cmp(a.published, b.published) || (a.rank - b.rank);
        return c * st.dir;
    });
    return rows;
}

/* ── pezzi di HTML ── */
function detailHtml(i){
    let h = `<div class="detail">`;
    if(i.summary) h += `<div>${esc(i.summary)}</div>`;
    if(i.cves.length){
        h += `<div class="dim">cve    ` + i.cves.map(c =>
            /^CVE-\d{4}-\d{4,}$/.test(c)
                ? `<a href="https://nvd.nist.gov/vuln/detail/${esc(c)}" target="_blank" rel="noopener noreferrer">${esc(c)}</a>`
                : esc(c)
        ).join(" ") + `</div>`;
    }
    if(i.tags.length) h += `<div class="dim">tags   ${esc(i.tags.join(", "))}</div>`;
    const srcs = i.sources.filter(s => safeUrl(s.url));
    if(srcs.length){
        h += `<div class="dim">fonti  ` + srcs.map(s =>
            `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title || safeUrl(s.url))}</a>`
        ).join(" ") + `</div>`;
    }
    return h + `</div>`;
}

function newsHtml(i){
    const open = openIds.has(i.id);
    const flag = (i.summary || i.cves.length || i.sources.length)
        ? `<span class="more"> [${open ? "-" : "+"}]</span>` : "";
    return esc(i.title) + flag + (open ? detailHtml(i) : "");
}

function rowHtml(i){
    const sev = SEV[i.severity] || ["", "sev-med", 1];
    return (
        `<tr>` +
        `<td class="c-date">${esc(i.published.slice(0, 10))}</td>` +
        `<td class="c-sev ${sev[1]}">${sev[0]}</td>` +
        `<td class="c-cat">${esc(catLabel(i.category))}</td>` +
        `<td class="c-news" data-id="${esc(i.id)}">${newsHtml(i)}</td>` +
        `</tr>`
    );
}

function pagerHtml(pages){
    if(pages <= 1) return "";
    const p = st.page, out = [];
    const link = (n, label, on) => `<a href="#" data-p="${n}"${on ? ' class="on"' : ''}>${label}</a>`;
    if(p > 1) out.push(link(p - 1, "&lt; prev"));
    const nums = [...new Set([1, pages, p-2, p-1, p, p+1, p+2])]
        .filter(n => n >= 1 && n <= pages)
        .sort((a, b) => a - b);
    let prev = 0;
    nums.forEach(n => {
        if(n - prev > 1) out.push('<span class="dim">..</span>');
        out.push(link(n, n, n === p));
        prev = n;
    });
    if(p < pages) out.push(link(p + 1, "next &gt;"));
    return out.join(" ");
}

/* ── render ── */
function render(){
    const rows  = filtered();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if(st.page > pages) st.page = pages;
    const slice = rows.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE);

    document.querySelectorAll("#filters a[data-f]").forEach(a => {
        const f = a.dataset.f, v = a.dataset.v;
        let on = false;
        if(f === "min")       on = parseInt(v, 10) === st.min;
        else if(f === "days") on = parseInt(v, 10) === st.days;
        else if(f === "cat")  on = v === st.cat;
        else if(f === "sort") on = st.sort === v;
        a.classList.toggle("on", on);
        if(f === "sort") a.textContent = a.dataset.label + (on ? (st.dir < 0 ? " v" : " ^") : "");
    });

    $("count").textContent = rows.length
        ? `;${rows.length} ${rows.length === 1 ? "notizia" : "notizie"} — pagina ${st.page}/${pages}`
        : ";nessuna notizia";

    if(!slice.length){
        $("list").innerHTML = "";
    } else {
        $("list").innerHTML =
            `<table id="tbl"><thead><tr><th>DATE</th><th>SEV</th><th>CAT</th><th>NEWS</th></tr></thead>` +
            `<tbody>${slice.map(rowHtml).join("")}</tbody></table>`;
    }
    $("pager").innerHTML = pagerHtml(pages);
}

/* ── eventi ── */
$("filters").addEventListener("click", e => {
    const a = e.target.closest("a[data-f]");
    if(!a) return;
    e.preventDefault();
    const f = a.dataset.f, v = a.dataset.v;
    if(f === "min")       st.min  = parseInt(v, 10);
    else if(f === "days") st.days = parseInt(v, 10);
    else if(f === "cat")  st.cat  = v;
    else if(f === "sort"){
        if(st.sort === v) st.dir = -st.dir;
        else { st.sort = v; st.dir = (v === "title") ? 1 : -1; }
    }
    st.page = 1;
    render();
});

$("pager").addEventListener("click", e => {
    const a = e.target.closest("a[data-p]");
    if(!a) return;
    e.preventDefault();
    st.page = parseInt(a.dataset.p, 10);
    render();
    $("count").scrollIntoView({ block: "start" });
});

$("list").addEventListener("click", e => {
    if(e.target.closest("a")) return;   /* i link alle fonti non devono aprire/chiudere la riga */
    const td = e.target.closest("td.c-news");
    if(!td) return;
    const id = td.dataset.id;
    const item = byId.get(id);
    if(!item) return;
    if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
    td.innerHTML = newsHtml(item);
});

let qTimer = null;
$("prompt-input").addEventListener("input", e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { st.q = e.target.value; st.page = 1; render(); }, 120);
});

/* ── caricamento dati ── */
async function load(){
    try{
        const res = await fetch("news_db.json", { cache: "no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        DB = await res.json();
        if(!DB || !Array.isArray(DB.items)) throw new Error("formato non valido");
    }catch(e){
        $("meta").innerHTML = "";
        $("list").innerHTML = `<div class="err">;news_db.json non disponibile (${esc(e.message)})</div>`;
        return;
    }

    /* normalizza: scarta voci senza id/titolo/data e riempie i campi mancanti */
    DB.items = DB.items.filter(i => i && i.id && i.title && /^\d{4}-\d{2}-\d{2}/.test(String(i.published || "")));
    DB.items.forEach(i => {
        i.id        = String(i.id);
        i.title     = String(i.title);
        i.published = String(i.published);
        i.summary   = String(i.summary || "");
        i.category  = String(i.category || "");
        i.tags      = Array.isArray(i.tags)    ? i.tags.map(String) : [];
        i.cves      = Array.isArray(i.cves)    ? i.cves.map(String) : [];
        i.sources   = Array.isArray(i.sources) ? i.sources.filter(s => s && typeof s === "object") : [];
        i.rank      = (SEV[i.severity] || [0, 0, 1])[2];
        i.hay       = [i.id, i.title, i.summary, i.category, catLabel(i.category), i.tags.join(" "), i.cves.join(" ")].join(" ").toLowerCase();
        byId.set(i.id, i);
    });

    /* bottoni categoria costruiti dai dati */
    const cats = [...new Set(DB.items.map(i => i.category).filter(Boolean))].sort();
    $("catlinks").innerHTML =
        `<a href="#" data-f="cat" data-v="all">ALL</a>` +
        cats.map(c => `<a href="#" data-f="cat" data-v="${esc(c)}">${esc(catLabel(c))}</a>`).join("");

    const upd = String(DB.updated || "");
    const updMs = Date.parse(upd.endsWith("Z") || /[+-]\d{2}:\d{2}$/.test(upd) ? upd : upd + "Z");
    const ageH = (Date.now() - updMs) / 3600000;
    let meta = `;notizie di cybersecurity degli ultimi giorni ;${DB.items.length} voci`;
    if(Number.isFinite(updMs)){
        const updLocal = new Date(updMs).toLocaleString("it-IT", { timeZone: "Europe/Rome", dateStyle: "short", timeStyle: "short" });
        meta += ` ;aggiornato ${esc(updLocal)}`;
        if(ageH > 36) meta += ` <span class="err">| dati vecchi di ${Math.round(ageH)} ore</span>`;
    }
    $("meta").innerHTML = meta;

    if(Number.isFinite(DB.window_days) && DB.window_days < st.days) st.days = DB.window_days;

    render();
    if(!/Mobi|Android/i.test(navigator.userAgent)) $("prompt-input").focus();
}

load();
</script>
</body>
</html>

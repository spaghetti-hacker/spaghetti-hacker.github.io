HARD CODED ~ HCF

<a href="https://spaghetti-hacker.github.io/">index.html</a>
visite: <span id="visits">...</span>

section .INTRODUZIONE

;il binario oggetto di analisi implementa un finto meccanismo di autenticazione basato su password e hash: si imposta una password, se ne dichiara la lunghezza, e infine si fornisce un valore di hash per "sbloccare" l'accesso e visualizzare la flag. Il documento è organizzato seguendo il flusso di esecuzione del programma: allocazione e setup iniziale del buffer, interazione con l'utente, meccanismo di verifica, analisi dettagliata di make_secret e dell'algoritmo di hashing (djb2), fino allo sfruttamento e alle conclusioni sulla natura della vulnerabilità.

_Nota_Metodologica:

;l'analisi è stata condotta con r2 (radare2) e IDA Free in modalità statica (disassembly di main, make_secret, hash) integrata da osservazione dinamica dei valori a runtimei con gdb, necessaria per confermare che l'output del meccanismo di hashing è costante e indipendente dall'input utente.

<img src="https://spaghetti-hacker.github.io/trust0.png" class="full-img">

section .SETUP_INIZIALE

;la funzione main alloca un buffer heap di 0x5a (90 byte) tramite calloc:

@@@
0x000013ee      mov esi, 1
0x000013f3      mov edi, 0x5a
0x000013f8      call sym.imp.calloc
0x000013fd      mov qword [dest], rax
@@@

;calloc(nmemb=0x5a, size=1) alloca 90 byte azzerati sull'heap; ogni elemento è grande 1 byte. Il puntatore risultante viene salvato in dest e riutilizzato più volte nel corso della funzione main. Subito dopo, un ciclo decodifica una stringa offuscata contenuta in obj.obf_bytes, applicando uno xor byte per byte con la chiave 0xaa, e scrive il risultato in dest a partire dall'offset +0x3c:

@@@
0x00001411      lea rdx, obj.obf_bytes
0x00001418      mov rax, qword [var_110h]
0x0000141f      add rax, rdx
0x00001422      movzx eax, byte [rax]
0x00001425      xor eax, 0xffffffaa
0x00001428      mov ecx, eax
0x0000142a      mov rax, qword [var_110h]
0x00001431      lea rdx, [rax + 0x3c]
0x00001435      mov rax, qword [dest]
0x0000143c      add rax, rdx
0x0000143f      mov edx, ecx
0x00001441      mov byte [rax], dl
0x00001443      add qword [var_110h], 1

for (i = 0; i <= 0xC; i++)
{
    dest[i + 0x3C] = obf_bytes[i] ^ 0xAA;
}
@@@

;il risultato di xor eax, 0xffffffaa viene memorizzato in edx. Alla fine con mov byte[rax], dl viene scritto solo dl, cioè gli 8 bit meno significativi di rdx. Il ciclo itera per 13 valori dell'indice, decodificando la password hardcoded in chiaro. Il risultato decodificato viene scritto in dest+0x3c, una regione del buffer separata da quella dove verra' poi copiato l'input utente. La stringa decodificata da questo primo ciclo corrisponde alla password hardcoded `iUbh81!j*hn!`, confermata tramite analisi dinamica del contenuto di memoria a runtime.

<img src="https://spaghetti-hacker.github.io/trust1.png" class="full-img">

section .INTERAZIONE_UTENTE

;il programma richiede all'utente di impostare una password (fgets su un buffer da 0x32 byte) e la copia, senza alcun controllo di lunghezza aggiuntivo oltre al limite di fgets, nel buffer dest tramite strcpy:

@@@
0x0000148f      mov rax, qword [dest]
0x00001499      mov rdi, rax
0x0000149c      call sym.imp.strcpy
@@@

;strcpy(dest, src) copia la password inserita dall'utente sovrascrivendo dest a partire dall'offset 0. Nessuna verifica sulla dimensione di src rispetto alla capacita' di dest (0x5a byte totali): potenziale overflow se l'input supera i limiti imposti a monte da fgets, ma non sfruttabile ai fini di questo challenge poiche' fgets limita gia' l'input a 0x32 byte. Segue una richiesta della lunghezza della password (convertita con atoi) e una stampa di debug che elenca, byte per byte, il contenuto decimale del buffer dest fino alla lunghezza indicata dall'utente:

@@@
0x0000153b      lea rax, [0x000020a3]       ;"%d "
0x0000154a      call sym.imp.printf
@@@

;il formato "%d " stampa ciascun byte del buffer come intero con segno, separato da spazio. Questa stampa e' puramente diagnostica/di debug; non influisce sul controllo di autenticazione.

_Nota:

;il ciclo di stampa è vincolato da un limite hardcoded aggiuntivo:

@@@
0x00001564      cmp dword [var_120h], 0x59
0x0000156b      jle 0x1520
@@@

;0x59 = 89 decimale, coerente con la capacita' massima del buffer allocato (0x5a = 90 byte, indice 0..89). Questo limite previene un over-read oltre il buffer allocato durante la stampa di debug, indipendentemente da quanto l'utente dichiari come lunghezza.

section .MECCANISMO_DI_VERIFICA

;l'utente viene quindi invitato a inserire un "hash" per accedere all'account. L'input viene letto con fgets, ripulito dell'eventuale newline finale, e convertito in un valore numerico a 64 bit tramite strtoul in base 10:

@@@
0x00001607      mov rsi, rcx
0x0000160a      mov rdi, rax
0x0000160d      call sym.imp.strtoul
0x00001612      mov qword [var_f8h], rax
@@@

;strtoul(str, endptr, base=10) converte la stringa in un long unsigned. Il valore risultante (var_f8h) sara' confrontato con l'hash "segreto" calcolato da make_secret. Il cuore del meccanismo è la chiamata a make_secret, seguita dal confronto diretto con il valore inserito dall'utente:

@@@
0x00001672      call sym.make_secret
0x00001677      mov qword [var_f0h], rax
0x00001685      cmp rax, qword [var_f8h]
0x0000168c      jne 0x172a
@@@

;se il valore ritornato da make_secret coincide con quanto digitato dall'utente, l'esecuzione prosegue verso la lettura e la stampa di flag.txt. In caso contrario si salta direttamente al cleanup (free + return), senza mostrare la flag.

_Analisi_di_make_secret:

@@@
0x0000135e 	sym.make_secret (int64_t arg1)
0x00001378      lea rdx, obj.obf_bytes
0x00001386      movzx eax, byte [rax]
0x00001389      xor eax, 0xffffffaa
0x0000139b      mov byte [rax], dl
0x000013b3      test al, al
0x000013b5      jne 0x1378
@@@

;make_secret NON opera sul buffer dest passato come argomento contenente la password dell'utente. Ri-decodifica invece, da zero, la stessa area obj.obf_bytes gia' processata in setup iniziale, applicando di nuovo lo xor con chiave 0xaa. Il ciclo termina al primo byte nullo incontrato (test al, al/jne), tipico terminatore di stringa C.

@@@
0x000013b7      mov rax, qword [var_18h]
0x000013bb      add rax, 0xc
0x000013bf      mov byte [rax], 0
0x000013c9      call sym.hash
@@@

;dopo la decodifica, viene forzato un byte null all'offset+0xc (troncamento a 12 caratteri). La stringa risultante, di lunghezza fissa 12, viene passata a sym.hash. Il valore di ritorno di hash diventa anche il valore di ritorno di make_secret (nessuna ulteriore elaborazione dopo la call).

_Implicazione_Critica:

;l'argomento arg1 ricevuto da make_secret (puntatore a dest, contenente potenzialmente la password modificata dall'utente) viene scritto ma mai letto prima della ri-decodifica di obj.obf_bytes. Il valore effettivamente hashato è sempre la password hardcoded originale, indipendentemente da qualunque input fornito dall'utente durante l'esecuzione.

section .ALGORITMO_DI_HASH

;la funzione sym.hash implementa l'algoritmo djb2, riconoscibile dal seed iniziale e dalla combinazione shift+add:

@@@
0x00001315      mov qword [var_8h], 0x1505
0x0000131f      mov rax, qword [var_8h]
0x00001323      shl rax, 5
0x0000132e      add rdx, rax
0x00001331      mov eax, dword [var_ch]
0x00001336      add rax, rdx
@@@

;djb2 è un algoritmo di hashing non crittografico ideato da Daniel J. Bernstein, diffuso a partire dagli anni '90 grazie alla sua semplicità e velocità. Non è pensato per la sicurezza (non offre resistenza a collisioni intenzionali né proprietà crittografiche), ma per usi pratici come hash table, indicizzazione di stringhe o generazione rapida di checksum in software dove le performance contano più della robustezza contro un attaccante. Il suo funzionamento si basa su un seed iniziale "magic" (5381) e su un ciclo che, per ogni carattere della stringa, aggiorna l'hash con la formula hash = hash * 33 + c. Il fattore 33 (ottenuto efficientemente con uno shift a sinistra di 5 bit più un'addizione, come si vede nel disassembly) è stato scelto empiricamente da Bernstein per la sua buona distribuzione statistica degli output, pur non avendo una giustificazione teorica rigorosa. Proprio per l'assenza di garanzie crittografiche, l'uso di djb2 (o varianti come djb2a) in contesti di autenticazione o verifica di segreti, come in questo binario, è una scelta debole: l'algoritmo è deterministico, veloce da invertire per bruteforce su input corti, e in questo caso specifico il problema è aggravato dal fatto che l'input hashato non dipende nemmeno dai dati forniti dall'utente.

@@@
0x0000134f      mov dword [var_ch], eax
0x00001352      cmp dword [var_ch], 0
0x00001356      jne 0x131f
@@@

;il ciclo termina al byte nullo, confermando che l'input e' trattato come stringa C standard null-terminated. Nessuna dipendenza da lunghezza esplicita: il calcolo si basa unicamente sul terminatore. Poiché l'input a questa funzione (la password hardcoded troncata a 12 byte) è costante ad ogni esecuzione, anche il valore restituito da hash è costante. L'analisi dinamica ha confermato il valore `15237662580160011234` come output invariante di make_secret/hash.

section .SFRUTTAMENTO

_Passi_Riproducibili:

;decodifica statica di obj.obf_bytes con xor 0xaa per ottenere la password hardcoded `iUbh81!j*hn!` (utile solo per la comprensione, non necessaria per il bypass).
;alla richiesta "Please set a password for your account", inserimento di un valore qualsiasi (non influisce sul risultato finale).
;alla richiesta "How many bytes in length is your password?", inserimento di un valore qualsiasi (usato solo per la stampa di debug, non per il controllo di sicurezza).
;alla richiesta "Enter your hash to access your account!", inserimento del valore costante `15237662580160011234`, ricavabile tramite breakpoint su make_secret o su hash in fase di analisi dinamica.

section .CONCLUSIONI

_Natura_della_Vulnerabilita:

;il meccanismo di autenticazione presenta un difetto di design (non un memory corruption bug) classificabile come "hardcoded secret con verifica indipendente dall'input utente". L'apparente flusso: imposta password, dichiara lunghezza, fornisci hash, induce l'utente a credere che il valore di confronto derivi dalla password appena impostata. In realtà make_secret ignora completamente il buffer contenente l'input utente e ricalcola sempre l'hash della password originale offuscata in obj.obf_bytes. La vulnerabilità nasce da un controllo di sicurezza che di fatto non verifica affatto l'input fornito, rendendo il meccanismo di autenticazione completamente cosmetico e aggirabile tramite semplice osservazione del valore costante atteso.

@@@
./system.out
Please set a password for your account:
BZBZBZBZ
How many bytes in length is your password?
8
You entered: 8
Your successfully stored password:
66 90 66 90 66 90 66 90 10
Enter your hash to access your account!
15237662580160011234
Hack The Planet!
@@@

<script>
(function(){
    const raw = document.getElementById('content').textContent;
    const lines = raw.split('\n');
    const output = document.getElementById('output');

    let i = 0;

    // salta righe vuote iniziali
    while(i < lines.length && lines[i].trim() === '') i++;

    // prima riga non vuota = titolo
    const title = lines[i] ? lines[i].trim() : '';
    if(title){
        document.title = title;
    }
    i++;

    // costruisce il contenuto dentro un unico div.article
    // il titolo è il nodo di testo iniziale del box
    let inner = escCode(title);
    i; // già avanzato

    while(i < lines.length){
        const line = lines[i];

        // blocco @@@ → codice pre-wrap
        if(line.trim() === '@@@'){
            i++;
            let block = '';
            while(i < lines.length && lines[i].trim() !== '@@@'){
                block += lines[i] + '\n';
                i++;
            }
            i++; // salta @@@ di chiusura
            // il codice viene escapato tranne &lt; &gt; &amp; già scritti
            //inner += escCode(block.replace(/\n$/, ''));
	    inner += '<pre class="codeblock">' + escCode(block.replace(/\n$/, '')) + '</pre>';
            continue;
        }

        // raccoglie testo fino al prossimo @@@
        let textLines = [];
        while(i < lines.length && lines[i].trim() !== '@@@'){
            textLines.push(lines[i]);
            i++;
        }

        const paragraphs = splitParagraphs(textLines);
        if(paragraphs.length > 0){
	    inner += '<div class="commento">\n';
            for (const p of paragraphs){
                if(p.type === 'title'){
                    inner += '<p class="title">' + p.text + '</p>\n';
                } else {
                    const cleaned = p.text.replace(/\n/g, '<br>');
                    inner += '<p>' + cleaned + '</p>\n';
                }
                }
            inner += '</div>';
        }
    }

    output.innerHTML = '<div class="article">' + inner + '</div>';

    // escapa solo il testo codice (non i commenti che possono avere HTML)
    function escCode(str){
        return str
            .replace(/&(?!(?:amp|lt|gt|quot|#\d+);)/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function splitParagraphs(lines){
        const result = [];
        let current = [];

        function flush(){
            if(current.length > 0){
                result.push({ type: 'text', text: current.join('\n') });
                current = [];
            }
        }

        for(const line of lines){
            const trimmed = line.trim();
            if(trimmed === ''){
                flush();
            } else if(/^(section|_)/.test(trimmed)){
                // riga "title": es. "section .CONCLUSIONI" o "_Natura_della_Vulnerabilita:"
                flush();
                result.push({ type: 'title', text: trimmed });
            } else {
                current.push(line);
            }
        }
        flush();
        return result;
    }
})();
</script>

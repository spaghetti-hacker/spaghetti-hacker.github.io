    const d = new Date();
    const t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - (days - 1) * 86400000;

    const ok = i =>
        i.rank >= st.min &&
        (st.scope === "all" || (st.scope === "IT" ? i.isIT : i.scope === st.scope)) &&
        (!cutoff || !i.date || i.date >= cutoff) &&
        (!q || i.hay.includes(q));
    return { actors: DB.actors.filter(ok), camps: DB.campaigns.filter(ok) };
}

function sortRows(rows){
    rows.sort((a, b) => {
        let c;
        if(st.sort === "conf")      c = (a.rank - b.rank) || cmp(a.date, b.date);
        else if(st.sort === "name") c = cmp(a.label.toLowerCase(), b.label.toLowerCase());
        else                        c = cmp(a.date, b.date) || (a.rank - b.rank);
        return c * st.dir;
    });
    return rows;
}

function ttpRows(){
    const { actors, camps } = sets(false);
    const q = st.q.trim().toLowerCase();
    const use = new Map();
    const bump = (i, kind) => i.ttps.forEach(id => {
        const e = use.get(id) || { a: [], c: [] };
        e[kind].push(i);
        use.set(id, e);
    });
    actors.forEach(a => bump(a, "a"));
    camps.forEach(c => bump(c, "c"));
    const rows = [];
    use.forEach((e, id) => {
        const t = ttpMap.get(id);
        if(q && !t.hay.includes(q)) return;
        rows.push({ t, a: e.a, c: e.c, n: e.a.length + e.c.length });
    });
    rows.sort((x, y) => (y.n - x.n) || cmp(x.t.id, y.t.id));
    return rows;
}

/* ── pezzi di HTML ── */
const L = (label, html) => `<div class="dim">${label}${html}</div>`;

function ttpLinks(ids){
    return ids.map(id => {
        const t = ttpMap.get(id);
        return `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(id)}${t.name ? " " + esc(t.name) : ""}</a>`;
    }).join(" ");
}

function srcLinks(list){
    if(!list.length) return "";
    return L("fonti  ", list.map(s =>
        `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title || safeUrl(s.url))}</a>`
    ).join(" "));
}

const itFlag = i => i.isIT ? `<span class="scope-it"> [IT]</span>` : "";
const autoFlag = i => i.auto ? `<span class="dim"> [auto]</span>` : "";

function actorCell(a, open){
    const al = a.aliases.length ? `<span class="alias"> (${esc(a.aliases.slice(0, 2).join(", "))})</span>` : "";
    let h = esc(a.name) + itFlag(a) + autoFlag(a) + al + `<span class="more"> [${open ? "-" : "+"}]</span>`;
    if(!open) return h;
    h += `<div class="detail">`;
    if(a.summary) h += `<div>${esc(a.summary)}</div>`;
    if(a.aliases.length)    h += L("alias  ", esc(a.aliases.join(", ")));
    h += L("origin ", esc([a.origin, ...a.motivation].filter(Boolean).join(" / ")));
    if(a.first_seen)        h += L("attivo ", esc(a.first_seen) + (a.date ? " ; ultima attivita " + esc(a.date) : ""));
    if(a.sectors.length)    h += L("settori", esc(a.sectors.map(sectLabel).join(", ")));
    if(a.tools.length)      h += L("strum. ", esc(a.tools.join(", ")));
    if(a.ttps.length)       h += L("ttp    ", ttpLinks(a.ttps));
    if(a.camps.length)      h += L("camp.  ", a.camps.map(c => esc(c.title)).join(" ; "));
    h += srcLinks(a.sources);
    return h + `</div>`;
}

function campCell(c, open){
    const act = c.actor ? `<span class="alias"> — ${esc(c.actor)}</span>` : "";
    let h = esc(c.title) + itFlag(c) + autoFlag(c) + act + `<span class="more"> [${open ? "-" : "+"}]</span>`;
    if(!open) return h;
    h += `<div class="detail">`;
    if(c.summary) h += `<div>${esc(c.summary)}</div>`;
    if(c.actor)           h += L("attore ", esc(c.actor));
    h += L("periodo", esc(c.start || "n/a") + (c.end ? " > " + esc(c.end) : " > in corso"));
    if(c.vector)          h += L("vettore", esc(c.vector));
    if(c.malware.length)  h += L("malware", esc(c.malware.join(", ")));
    if(c.sectors.length)  h += L("settori", esc(c.sectors.map(sectLabel).join(", ")));
    if(c.ttps.length)     h += L("ttp    ", ttpLinks(c.ttps));
    if(c.tlp)             h += L("tlp    ", esc("TLP:" + c.tlp));
    h += srcLinks(c.sources);
    return h + `</div>`;
}

function ttpCell(r, open){
    const t = r.t;
    let h = esc(t.name || t.id) + `<span class="more"> [${open ? "-" : "+"}]</span>`;
    if(!open) return h;
    h += `<div class="detail">`;
    if(r.a.length) h += L("attori ", esc(r.a.map(a => a.name).join(", ")));
    if(r.c.length) h += L("camp.  ", r.c.map(c => esc(c.title)).join(" ; "));
    h += L("mitre  ", `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.id)}</a>`);
    return h + `</div>`;
}

function confCell(i){
    const c = CONF[i.confidence] || ["n/a", "conf-low", 0];
    return `<td class="c-sev ${c[1]}">${c[0]}</td>`;
}

function actorRow(a){
    const k = "actors:" + a.id;
    return `<tr><td class="c-date">${esc(a.date || "n/a")}</td>${confCell(a)}` +
           `<td class="c-cat">${esc(a.origin || "n/a")}</td>` +
           `<td class="c-news" data-key="${esc(k)}">${actorCell(a, openIds.has(k))}</td></tr>`;
}

function campRow(c){
    const k = "campaigns:" + c.id;
    return `<tr><td class="c-date">${esc(c.date || "n/a")}</td>${confCell(c)}` +
           `<td class="c-cat${c.isIT ? " scope-it" : ""}">${esc(c.scope || "n/a")}</td>` +
           `<td class="c-news" data-key="${esc(k)}">${campCell(c, openIds.has(k))}</td></tr>`;
}

function ttpRow(r){
    const k = "ttp:" + r.t.id;
    return `<tr><td class="c-date">${esc(r.t.id)}</td>` +
           `<td class="c-sev">${esc(r.t.tactic || "n/a")}</td>` +
           `<td class="c-cat">${r.a.length}a / ${r.c.length}c</td>` +
           `<td class="c-news" data-key="${esc(k)}">${ttpCell(r, openIds.has(k))}</td></tr>`;
}

function pad(s, n){ return s + " ".repeat(Math.max(0, n - s.length)); }

function sectorsHtml(){
    const { actors, camps } = sets(false);
    const m = new Map();
    const add = (i, kind) => i.sectors.forEach(s => {
        const e = m.get(s) || { a: 0, c: 0, it: 0 };
        e[kind]++;
        if(i.isIT) e.it++;
        m.set(s, e);
    });
    actors.forEach(a => add(a, "a"));
    camps.forEach(c => add(c, "c"));
    const rows = [...m.entries()]
        .map(([k, e]) => ({ k, e, n: e.a + e.c }))
        .sort((x, y) => (y.n - x.n) || cmp(x.k, y.k));
    if(!rows.length) return { n: 0, html: "" };
    const max = rows[0].n, W = 20;
    const html = `<div class="bars">` + rows.map(r => {
        const fill = Math.max(1, Math.round(r.n / max * W));
        const lab = sectLabel(r.k);
        return `<div class="srow"><a href="#" data-sector="${esc(r.k)}">${esc(lab)}</a>${" ".repeat(Math.max(1, 13 - lab.length))}` +
               `<span class="bar">[${"#".repeat(fill)}${".".repeat(W - fill)}]</span> ${r.n}` +
               `<span class="dim"> (att ${r.e.a} / camp ${r.e.c})</span>` +
               (r.e.it ? `<span class="scope-it"> IT:${r.e.it}</span>` : "") + `</div>`;
    }).join("") + `</div>`;
    return { n: rows.length, html };
}

function pagerHtml(pages){
    if(pages <= 1) return "";
    const p = st.page, out = [];
    const link = (n, label, on) => `<a href="#" data-p="${n}"${on ? ' class="on"' : ''}>${label}</a>`;
    if(p > 1) out.push(link(p - 1, "&lt; prev"));
    const nums = [...new Set([1, pages, p-2, p-1, p, p+1, p+2])]
        .filter(n => n >= 1 && n <= pages)
        .sort((a, b) => a - b);
    let prev = 0;
    nums.forEach(n => {
        if(n - prev > 1) out.push('<span class="dim">..</span>');
        out.push(link(n, n, n === p));
        prev = n;
    });
    if(p < pages) out.push(link(p + 1, "next &gt;"));
    return out.join(" ");
}

/* ── render ── */
function render(){
    /* stato dei bottoni */
    document.querySelectorAll("#filters a[data-f]").forEach(a => {
        const f = a.dataset.f, v = a.dataset.v;
        let on = false;
        if(f === "min")        on = parseInt(v, 10) === st.min;
        else if(f === "days")  on = parseInt(v, 10) === st.days;
        else if(f === "scope") on = v === st.scope;
        else if(f === "sort")  on = st.sort === v;
        a.classList.toggle("on", on);
        if(f === "sort") a.textContent = a.dataset.label + (on ? (st.dir < 0 ? " v" : " ^") : "");
    });
    $("sortrow").style.display = (st.tab === "actors" || st.tab === "campaigns") ? "" : "none";

    /* contatori nelle tab */
    const full = sets(true);
    const counts = { actors: full.actors.length, campaigns: full.camps.length, ttp: ttpRows().length, sectors: sectorsHtml().n };
    document.querySelectorAll("#tabs a[data-tab]").forEach(a => {
        const t = a.dataset.tab;
        a.classList.toggle("on", t === st.tab);
        a.textContent = `[${TABS[t]} ${counts[t]}]`;
    });

    let rows = [], head = "", rowFn = null, label = "";
    if(st.tab === "actors"){
        rows = sortRows(full.actors); rowFn = actorRow; label = ["attore", "attori"];
        head = "<th>LAST</th><th>CONF</th><th>ORIGIN</th><th>ACTOR</th>";
    } else if(st.tab === "campaigns"){
        rows = sortRows(full.camps); rowFn = campRow; label = ["campagna", "campagne"];
        head = "<th>DATE</th><th>CONF</th><th>SCOPE</th><th>CAMPAIGN</th>";
    } else if(st.tab === "ttp"){
        rows = ttpRows(); rowFn = ttpRow; label = ["tecnica", "tecniche"];
        head = "<th>ID</th><th>TACTIC</th><th>USO</th><th>TECHNIQUE</th>";
    }

    if(st.tab === "sectors"){
        const s = sectorsHtml();
        $("count").textContent = s.n ? `;${s.n} settori — attori + campagne, ordinati per attivita (clic = filtra campagne)` : ";nessun settore";
        $("list").innerHTML = s.html;
        $("pager").innerHTML = "";
        return;
    }

    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if(st.page > pages) st.page = pages;
    const slice = rows.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE);

    $("count").textContent = rows.length
        ? `;${rows.length} ${rows.length === 1 ? label[0] : label[1]} — pagina ${st.page}/${pages}`
        : ";nessun risultato";

    $("list").innerHTML = slice.length
        ? `<table id="tbl" class="t-${st.tab}"><thead><tr>${head}</tr></thead><tbody>${slice.map(rowFn).join("")}</tbody></table>`
        : "";
    $("pager").innerHTML = pagerHtml(pages);
}

/* ── eventi ── */
$("tabs").addEventListener("click", e => {
    const a = e.target.closest("a[data-tab]");
    if(!a) return;
    e.preventDefault();
    st.tab = a.dataset.tab;
    st.page = 1;
    try{ history.replaceState(null, "", "#" + st.tab); }catch(_){}
    render();
});

$("filters").addEventListener("click", e => {
    const a = e.target.closest("a[data-f]");
    if(!a) return;
    e.preventDefault();
    const f = a.dataset.f, v = a.dataset.v;
    if(f === "min")        st.min   = parseInt(v, 10);
    else if(f === "days")  st.days  = parseInt(v, 10);
    else if(f === "scope") st.scope = v;
    else if(f === "sort"){
        if(st.sort === v) st.dir = -st.dir;
        else { st.sort = v; st.dir = (v === "name") ? 1 : -1; }
    }
    st.page = 1;
    render();
});

$("pager").addEventListener("click", e => {
    const a = e.target.closest("a[data-p]");
    if(!a) return;
    e.preventDefault();
    st.page = parseInt(a.dataset.p, 10);
    render();
    $("count").scrollIntoView({ block: "start" });
});

$("list").addEventListener("click", e => {
    const sec = e.target.closest("a[data-sector]");
    if(sec){
        e.preventDefault();
        st.q = sec.dataset.sector;
        $("prompt-input").value = st.q;
        st.tab = "campaigns";
        st.page = 1;
        try{ history.replaceState(null, "", "#campaigns"); }catch(_){}
        render();
        return;
    }
    if(e.target.closest("a")) return;   /* i link esterni non devono aprire/chiudere la riga */
    const td = e.target.closest("td.c-news");
    if(!td) return;
    const key = td.dataset.key;
    if(openIds.has(key)) openIds.delete(key); else openIds.add(key);
    render();
});

let qTimer = null;
$("prompt-input").addEventListener("input", e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { st.q = e.target.value; st.page = 1; render(); }, 120);
});

/* ── caricamento dati ── */
async function load(){
    try{
        const res = await fetch("cti_db.json", { cache: "no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        DB = await res.json();
        if(!DB || typeof DB !== "object" || !Array.isArray(DB.actors) || !Array.isArray(DB.campaigns)) throw new Error("formato non valido");
    }catch(e){
        $("meta").innerHTML = "";
        $("list").innerHTML = `<div class="err">;cti_db.json non disponibile (${esc(e.message)})</div>`;
        return;
    }

    /* tecniche MITRE note + stub per quelle citate ma assenti */
    (Array.isArray(DB.ttps) ? DB.ttps : []).forEach(t => {
        if(!t || !t.id) return;
        const id = String(t.id);
        ttpMap.set(id, { id, name: String(t.name || ""), tactic: String(t.tactic || ""), url: safeUrl(t.url) || ttpUrl(id) });
    });
    const ensureTtp = id => {
        if(!ttpMap.has(id)) ttpMap.set(id, { id, name: "", tactic: "", url: ttpUrl(id) });
    };

    /* normalizza attori */
    DB.actors = DB.actors.filter(a => a && a.id && a.name).map(a => ({
        id:         String(a.id),
        label:      String(a.name),
        name:       String(a.name),
        aliases:    arr(a.aliases),
        origin:     String(a.origin || ""),
        motivation: arr(a.motivation),
        sectors:    arr(a.sectors),
        tools:      arr(a.tools),
        ttps:       arr(a.ttps),
        scope:      String(a.scope || ""),
        isIT:       a.scope === "IT" || a.targets_italy === true,
        first_seen: String(a.first_seen || ""),
        date:       dateOf(a.last_activity),
        confidence: String(a.confidence || "").toUpperCase(),
        summary:    String(a.summary || ""),
        sources:    srcs(a.sources),
        auto:       a.auto === true,
        camps:      []
    }));

    /* normalizza campagne */
    DB.campaigns = DB.campaigns.filter(c => c && c.id && c.title).map(c => {
        const start = dateOf(c.start), end = dateOf(c.end);
        return {
            id:         String(c.id),
            label:      String(c.title),
            title:      String(c.title),
            actor:      String(c.actor || ""),
            start, end,
            date:       (end && end > start) ? end : start,
            scope:      String(c.scope || ""),
            isIT:       c.scope === "IT",
            sectors:    arr(c.sectors),
            vector:     String(c.vector || ""),
            malware:    arr(c.malware),
            ttps:       arr(c.ttps),
            confidence: String(c.confidence || "").toUpperCase(),
            tlp:        String(c.tlp || "").toUpperCase(),
            summary:    String(c.summary || ""),
            sources:    srcs(c.sources),
            auto:       c.auto === true
        };
    });

    /* collega campagne e attori (nome, id o alias) */
    const byName = new Map();
    DB.actors.forEach(a => [a.id, a.name, ...a.aliases].forEach(n => byName.set(n.toLowerCase(), a)));
    DB.campaigns.forEach(c => {
        const a = byName.get(c.actor.toLowerCase());
        if(a) a.camps.push(c);
    });

    [...DB.actors, ...DB.campaigns].forEach(i => {
        i.ttps.forEach(ensureTtp);
        i.rank = (CONF[i.confidence] || [0, 0, 0])[2];
    });
    ttpMap.forEach(t => { t.hay = [t.id, t.name, t.tactic].join(" ").toLowerCase(); });

    DB.actors.forEach(a => {
        a.hay = [a.id, a.name, a.aliases.join(" "), a.origin, a.motivation.join(" "), a.sectors.join(" "), a.sectors.map(sectLabel).join(" "),
                 a.tools.join(" "), a.scope, a.isIT ? "italia italy" : "", a.summary, a.ttps.map(id => id + " " + ttpMap.get(id).name).join(" ")].join(" ").toLowerCase();
    });
    DB.campaigns.forEach(c => {
        c.hay = [c.id, c.title, c.actor, c.scope, c.isIT ? "italia italy" : "", c.sectors.join(" "), c.sectors.map(sectLabel).join(" "),
                 c.vector, c.malware.join(" "), c.summary, c.ttps.map(id => id + " " + ttpMap.get(id).name).join(" ")].join(" ").toLowerCase();
    });

    /* avvisi */
    const upd = String(DB.updated || "");
    const updMs = Date.parse(upd.endsWith("Z") || /[+-]\d{2}:\d{2}$/.test(upd) ? upd : upd + "Z");
    const ageH = (Date.now() - updMs) / 3600000;
    let meta = `;Threat intelligence con focus Italia ;${DB.actors.length} attori ;${DB.campaigns.length} campagne`;
    if(Number.isFinite(updMs)){
        const updLocal = new Date(updMs).toLocaleString("it-IT", { timeZone: "Europe/Rome", dateStyle: "short", timeStyle: "short" });
        meta += ` ;aggiornato ${esc(updLocal)}`;
        if(ageH > 72) meta += ` <span class="err">| dati vecchi di ${Math.round(ageH / 24)} giorni</span>`;
    }
    $("meta").innerHTML = meta;
    if(DB.sample === true) $("notice").innerHTML = `<span class="err">;ATTENZIONE: dati di esempio, eseguire cti_update.py per generare cti_db.json reale</span>`;

    if(Number.isFinite(DB.window_days) && DB.window_days > 0 && st.days !== 0 && DB.window_days < st.days) st.days = DB.window_days;

    const h = location.hash.slice(1);
    if(TABS[h]) st.tab = h;

    render();
    if(!/Mobi|Android/i.test(navigator.userAgent)) $("prompt-input").focus();
}

load();
</script>

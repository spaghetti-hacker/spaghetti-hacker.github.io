            <a href="#" data-f="min" data-v="0">ALL</a><a href="#" data-f="min" data-v="9">9+</a><a href="#" data-f="min" data-v="9.5">9.5+</a>
        </div>
        <div class="frow"><span class="dim">since  </span>
            <a href="#" data-f="days" data-v="1">24h</a><a href="#" data-f="days" data-v="3">3d</a><a href="#" data-f="days" data-v="7">7d</a>
        </div>
        <div class="frow" id="kevrow"><span class="dim">filter </span>
            <a href="#" data-f="kev">KEV only</a>
        </div>
        <div class="frow"><span class="dim">sort   </span>
            <a href="#" data-f="sort" data-v="date" data-label="DATE">DATE</a><a href="#" data-f="sort" data-v="score" data-label="CVSS">CVSS</a><a href="#" data-f="sort" data-v="id" data-label="ID">ID</a>
        </div>
    </div>

    </div>

<script>
const PAGE_SIZE  = 50;
const DESC_SHORT = 150;
const SEV = {
    CRITICAL: ["CRIT", "sev-crit"],
    HIGH:     ["HIGH", "sev-high"],
    MEDIUM:   ["MED",  "sev-med"],
    LOW:      ["LOW",  "sev-med"]
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;

let DB = null;
let byId = new Map();
const openIds = new Set();
const st = { min:0, days:7, kev:false, q:"", sort:"date", dir:-1, page:1 };

/* ── filtro + ordinamento ── */
function filtered(){
    const cutoff = Date.now() - st.days * 86400000;
    const q = st.q.trim().toLowerCase();
    const rows = DB.items.filter(i =>
        i.score >= st.min &&
        (!st.kev || i.kev) &&
        Date.parse(i.published) >= cutoff &&
        (!q || i.id.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q))
    );
    rows.sort((a, b) => {
        let c;
        if(st.sort === "score")   c = (a.score - b.score) || cmp(a.published, b.published);
        else if(st.sort === "id") c = cmp(a.id, b.id);
        else                      c = cmp(a.published, b.published);
        return c * st.dir;
    });
    return rows;
}

/* ── pezzi di HTML ── */
function descHtml(i){
    const long = i.desc.length > DESC_SHORT;
    if(!long) return esc(i.desc);
    if(openIds.has(i.id)) return esc(i.desc) + '<span class="more"> [-]</span>';
    return esc(i.desc.slice(0, DESC_SHORT).trimEnd()) + '<span class="more"> [+]</span>';
}

function rowHtml(i){
    const sev = SEV[i.severity] || ["", "sev-med"];
    const idOk = /^CVE-\d{4}-\d{4,}$/.test(i.id);
    const idHtml = idOk
        ? `<a href="https://nvd.nist.gov/vuln/detail/${esc(i.id)}" target="_blank" rel="noopener noreferrer">${esc(i.id)}</a>`
        : esc(i.id);
    return (
        `<tr>` +
        `<td class="c-id">${idHtml}</td>` +
        `<td class="c-date">${esc((i.published || "").slice(0, 10))}</td>` +
        `<td class="c-score ${sev[1]}">${i.score.toFixed(1)} ${sev[0]}</td>` +
        `<td class="c-kev">${i.kev ? "[KEV]" : ""}</td>` +
        `<td class="c-desc${i.desc.length > DESC_SHORT ? " long" : ""}" data-id="${esc(i.id)}">${descHtml(i)}</td>` +
        `</tr>`
    );
}

function pagerHtml(pages){
    if(pages <= 1) return "";
    const p = st.page, out = [];
    const link = (n, label, on) => `<a href="#" data-p="${n}"${on ? ' class="on"' : ''}>${label}</a>`;
    if(p > 1) out.push(link(p - 1, "&lt; prev"));
    const nums = [...new Set([1, pages, p-2, p-1, p, p+1, p+2])]
        .filter(n => n >= 1 && n <= pages)
        .sort((a, b) => a - b);
    let prev = 0;
    nums.forEach(n => {
        if(n - prev > 1) out.push('<span class="dim">..</span>');
        out.push(link(n, n, n === p));
        prev = n;
    });
    if(p < pages) out.push(link(p + 1, "next &gt;"));
    return out.join(" ");
}

/* ── render ── */
function render(){
    const rows  = filtered();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if(st.page > pages) st.page = pages;
    const slice = rows.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE);

    document.querySelectorAll("#filters a[data-f]").forEach(a => {
        const f = a.dataset.f, v = a.dataset.v;
        let on = false;
        if(f === "min")       on = parseFloat(v) === st.min;
        else if(f === "days") on = parseInt(v, 10) === st.days;
        else if(f === "kev")  on = st.kev;
        else if(f === "sort") on = st.sort === v;
        a.classList.toggle("on", on);
        if(f === "sort") a.textContent = a.dataset.label + (on ? (st.dir < 0 ? " v" : " ^") : "");
    });

    $("count").textContent = rows.length
        ? `;${rows.length} ${rows.length === 1 ? "risultato" : "risultati"} — pagina ${st.page}/${pages}`
        : ";nessun risultato";

    if(!slice.length){
        $("list").innerHTML = "";
    } else {
        $("list").innerHTML =
            `<table id="tbl"><thead><tr><th>CVE</th><th>PUBLISHED</th><th>CVSS</th><th>KEV</th><th>DESCRIPTION</th></tr></thead>` +
            `<tbody>${slice.map(rowHtml).join("")}</tbody></table>`;
    }
    $("pager").innerHTML = pagerHtml(pages);
}

/* ── eventi ── */
$("filters").addEventListener("click", e => {
    const a = e.target.closest("a[data-f]");
    if(!a) return;
    e.preventDefault();
    const f = a.dataset.f, v = a.dataset.v;
    if(f === "min")       st.min  = parseFloat(v);
    else if(f === "days") st.days = parseInt(v, 10);
    else if(f === "kev")  st.kev  = !st.kev;
    else if(f === "sort"){
        if(st.sort === v) st.dir = -st.dir;
        else { st.sort = v; st.dir = (v === "id") ? 1 : -1; }
    }
    st.page = 1;
    render();
});

$("pager").addEventListener("click", e => {
    const a = e.target.closest("a[data-p]");
    if(!a) return;
    e.preventDefault();
    st.page = parseInt(a.dataset.p, 10);
    render();
    $("count").scrollIntoView({ block: "start" });
});

$("list").addEventListener("click", e => {
    const td = e.target.closest("td.c-desc.long");
    if(!td) return;
    const id = td.dataset.id;
    const item = byId.get(id);
    if(!item) return;
    if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
    td.innerHTML = descHtml(item);
});

let qTimer = null;
$("prompt-input").addEventListener("input", e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { st.q = e.target.value; st.page = 1; render(); }, 120);
});

/* ── caricamento dati ── */
async function load(){
    try{
        const res = await fetch("cve_db.json", { cache: "no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        DB = await res.json();
        if(!DB || !Array.isArray(DB.items)) throw new Error("formato non valido");
    }catch(e){
        $("meta").innerHTML = "";
        $("list").innerHTML = `<div class="err">;cve_db.json non disponibile (${esc(e.message)}). Lancia update_cve.py</div>`;
        return;
    }

    DB.items = DB.items.filter(i => i && i.id && typeof i.score === "number");
    DB.items.forEach(i => { i.desc = i.desc || ""; i.published = i.published || ""; byId.set(i.id, i); });

    const kevCount = DB.items.filter(i => i.kev).length;
    const upd = String(DB.updated || "");
    const ageH = (Date.now() - Date.parse(upd)) / 3600000;
    let meta = `;CVE pubblicate negli ultimi ${esc(DB.window_days)} giorni con CVSS &gt;= ${esc(DB.min_score)} ;fonti: NVD, CISA KEV ;aggiornato ${esc(upd.replace("T", " ").slice(0, 16))} UTC`;
    if(ageH > 36) meta += ` <span class="err">| dati vecchi di ${Math.round(ageH)} ore</span>`;
    if(DB.kev_checked === false) meta += ` <span class="err">| flag KEV non disponibile</span>`;
    else meta += ` | KEV: ${kevCount}`;
    $("meta").innerHTML = meta;

    if(DB.kev_checked === false) $("kevrow").style.display = "none";
    if(Number.isFinite(DB.window_days) && DB.window_days < st.days) st.days = DB.window_days;

    render();
    if(!/Mobi|Android/i.test(navigator.userAgent)) $("prompt-input").focus();
}

load();
</script>
</body>
